# Запуск Runit в контейнерах.
#
#   docker compose up --build
#   → http://localhost:8080
#
# Переменные берутся из .env (см. README, раздел «Развёртывание»).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DB_PATH: /data/database.sqlite
      # Секреты подписи токенов. Синтаксис с `:?` останавливает compose с этим
      # сообщением, если переменной нет — иначе приложение просто не поднялось
      # бы, и причину пришлось бы искать в логах контейнера.
      # Сгенерировать:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?задайте JWT_ACCESS_SECRET в .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?задайте JWT_REFRESH_SECRET в .env}
      # Интерфейс и API отдаёт один и тот же Caddy (сервис web), поэтому запросы
      # к /trpc идут с того же origin и CORS не участвует. Переменная остаётся
      # для схем, где фронт вынесен на отдельный домен.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # ВНИМАНИЕ. Compose поднимает прод-сборку по http://localhost:8080, а
      # браузер не отправляет Secure-cookie по http — с включённым флагом вход
      # не работал бы. Для боевого стенда за TLS переменную не задавайте:
      # по умолчанию в production Secure включён.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Раннер кода: без доступа к docker он корректно деградирует —
      # приложение работает, серверный запуск отвечает понятной подсказкой.
      RUNNER_ENABLED: ${RUNNER_ENABLED:-true}
      RUNNER_MAX_CONCURRENT: ${RUNNER_MAX_CONCURRENT:-4}
    volumes:
      # БД живёт в томе, а не в слое образа: пересборка не теряет данные.
      - runit-data:/data
      # ВНИМАНИЕ. Чтобы серверный раннер (Python/PHP/Ruby/Java/…) работал внутри
      # контейнера, ему нужен доступ к docker-сокету. Доступ к сокету равносилен
      # root на хосте, а раннер исполняет ЧУЖОЙ код — поэтому по умолчанию сокет
      # НЕ монтируется. Для прода используйте выделенный runner-хост или
      # rootless/удалённый демон (см. README). Раскомментируйте только локально:
      # - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - '3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      # Контекст — корень репозитория: фронту нужны типы из types/.
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      app:
        condition: service_healthy

volumes:
  runit-data:
