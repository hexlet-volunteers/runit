# Локальный запуск Runit в контейнерах.
#
#   cp .env.example .env   # и задать JWT-секреты, см. docs/deployment.md
#   docker compose up --build
#   → http://localhost:8080
#
# Это способ проверить прод-сборку на своей машине. Боевой стенд поднимается
# из docker-compose.prod.yml: там образы берутся из реестра, а PostgreSQL —
# managed, а не контейнером рядом.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runit}
      POSTGRES_DB: ${POSTGRES_DB:-runit}
    volumes:
      # Данные в томе, а не в слое: пересборка не теряет базу.
      - runit-db:/var/lib/postgresql/data
    healthcheck:
      # Без этой проверки приложение стартует раньше базы, падает на миграциях
      # и уходит в цикл перезапусков.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-runit} -d ${POSTGRES_DB:-runit}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-runit}:${POSTGRES_PASSWORD:-runit}@db:5432/${POSTGRES_DB:-runit}
      # Секреты подписи токенов. Синтаксис с `:?` останавливает compose с этим
      # сообщением, если переменной нет — иначе приложение просто не поднялось
      # бы, и причину пришлось бы искать в логах контейнера.
      # Сгенерировать:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?задайте JWT_ACCESS_SECRET в .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?задайте JWT_REFRESH_SECRET в .env}
      # Интерфейс и API отдаёт один и тот же Caddy (сервис web), поэтому запросы
      # к /trpc идут с того же origin и CORS не участвует. Переменная остаётся
      # для схем, где фронт вынесен на отдельный домен.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # ВНИМАНИЕ. Compose поднимает прод-сборку по http://localhost:8080, а
      # браузер не отправляет Secure-cookie по http — с включённым флагом вход
      # не работал бы. Для боевого стенда за TLS переменную не задавайте:
      # по умолчанию в production Secure включён.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Перед приложением стоит наш Caddy (сервис web) — ровно один прокси.
      # Без этого лимитер считает всех посетителей одним клиентом: адрес берётся
      # из сокета, а он у всех одинаковый — адрес прокси.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Раннер кода: без доступа к docker он корректно деградирует —
      # приложение работает, серверный запуск отвечает понятной подсказкой.
      RUNNER_ENABLED: ${RUNNER_ENABLED:-true}
      RUNNER_MAX_CONCURRENT: ${RUNNER_MAX_CONCURRENT:-4}
    # ВНИМАНИЕ. Чтобы серверный раннер (Python/PHP/Ruby/Java/…) работал внутри
    # контейнера, ему нужен доступ к docker-сокету. Доступ к сокету равносилен
    # root на хосте, а раннер исполняет ЧУЖОЙ код — поэтому по умолчанию сокет
    # НЕ монтируется. Для прода используйте выделенный runner-хост или
    # rootless/удалённый демон (см. docs/runner.md). Раскомментируйте локально:
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - '3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      # Контекст — корень репозитория: фронту нужны типы из types/.
      context: .
      dockerfile: frontend/Dockerfile
      # Значения Vite вшиваются в статику на сборке — задавать их через
      # environment бессмысленно, поэтому они передаются аргументами сборки.
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_PUBLIC_BASE_URL: ${VITE_PUBLIC_BASE_URL:-}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      app:
        condition: service_healthy

volumes:
  runit-db:
