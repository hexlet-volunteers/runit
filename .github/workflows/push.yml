name: On Push

on:
  push:
    branches:
      - main

jobs:
  checks:
    name: Проверки main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей (бэкенд)
        run: npm ci

      - name: Линтер (Biome)
        run: npm run lint

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Юнит-тесты раннера
        run: npm run test:runner

      - name: Тесты авторизации и политики паролей
        run: npm run test:unit

      - name: Установка зависимостей (фронтенд)
        run: npm ci
        working-directory: frontend

      - name: Проверка типов фронтенда
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Сборка фронтенда
        run: npm run build
        working-directory: frontend

  # Публикация образов вынесена в publish.yml — он тоже срабатывает на push в
  # main и кладёт в GHCR тег edge. Прежняя job-заглушка «Деплой (не настроен)»
  # удалена: она печатала echo и зеленела, то есть в интерфейсе выглядела как
  # успешный деплой. Отсутствующий шаг видно сразу, ложно-зелёный успокаивает.
