name: On Push

on:
  push:
    branches:
      - main

jobs:
  checks:
    name: Проверки main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей (бэкенд)
        run: npm ci

      - name: Линтер (Biome)
        run: npm run lint

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Юнит-тесты раннера
        run: npm run test:runner

      - name: Тесты авторизации и политики паролей
        run: npm run test:unit

      - name: Установка зависимостей (фронтенд)
        run: npm ci
        working-directory: frontend

      - name: Проверка типов фронтенда
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Сборка фронтенда
        run: npm run build
        working-directory: frontend

  # Деплой пока не настроен: не выбрано, куда публиковать образы и где хостится
  # приложение (см. задачи вехи «Релиз»). Как только цель появится — здесь будет
  # build & push образов из Dockerfile и frontend/Dockerfile.
  deploy:
    name: Деплой (не настроен)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Заглушка
        run: |
          echo "🚧 Деплой не настроен: не выбран реестр образов и хостинг."
          echo "Образы собираются и проверяются в CI на каждом PR."
          echo "Коммит: ${{ github.sha }}"
