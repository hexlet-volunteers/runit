name: Раскатка

# Раскатка выпущенной версии на стенды. Вызывается из release-please.yml после
# того, как релизный PR смержен и образы опубликованы.
#
# Собственного триггера у этого workflow нет намеренно. Раньше он висел на
# `push: tags: v*` и сам создавал запись в GitHub Releases. И то, и другое
# теперь лишнее: запись создаёт release-please, а тег он ставит встроенным
# GITHUB_TOKEN — события от такого тега других workflow не запускают, поэтому
# триггер по тегу молча не срабатывал бы и выпуск заканчивался бы без деплоя.
#
# Стендов два, и они независимы: свой сервер по docker-compose и PaaS (Heroku).
# Оба получают одну и ту же версию намеренно — иначе «что в проде» перестаёт
# быть одним числом.
#
# Каждая раскатка включается только когда заданы её настройки. Пока их нет, job
# называет причину пропуска и завершается успешно: это не то же самое, что
# заглушка с `echo`, которая когда-то стояла здесь и изображала рабочий деплой.
#
# Что нужно задать в настройках репозитория:
#   свой сервер (docker-compose)
#     переменная DEPLOY_HOST     — хост стенда (он же адрес для проверки /health)
#     переменная DEPLOY_USER     — пользователь ssh
#     переменная DEPLOY_PATH     — каталог с docker-compose.prod.yml на сервере
#     секрет     DEPLOY_KEY      — приватный ключ ssh
#   PaaS
#     переменная HEROKU_APP      — имя приложения
#     секрет     HEROKU_API_KEY  — ключ API (heroku authorizations:create)
#
# Секреты приложения и строка подключения к managed PostgreSQL задаются на самом
# стенде — в .env на сервере или в config vars приложения. В репозиторий и в
# образ они не попадают.

on:
  workflow_call:
    inputs:
      version:
        description: Версия выпуска X.Y.Z, без ведущей v.
        required: true
        type: string

jobs:
  deploy:
    name: Раскатка на стенд
    # Ожидание публикации образов обеспечивает вызывающий workflow (needs:
    # publish в release-please.yml): раскатка их только скачивает, и без этого
    # порядка деплой опережал публикацию и просил ещё не опубликованный тег.
    runs-on: ubuntu-latest
    if: github.repository == 'hexlet-volunteers/runit'
    steps:
      - name: Настроен ли стенд
        id: check
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Стенд не настроен: переменная DEPLOY_HOST пуста." \
              "Образы опубликованы в GHCR, раскатка пропущена."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Раскатка по ssh
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          # Образ уже собран и проверен в CI — на сервере только подтягиваем
          # нужный тег и перезапускаем. `--wait` ждёт healthcheck: без него шаг
          # зеленел бы раньше, чем приложение действительно поднялось, и
          # неудачный релиз выглядел бы успешным.
          #
          # Миграции прогоняет само приложение при старте (runMigrations),
          # отдельного шага не нужно.
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            # Версия приходит уже без ведущей v — так её отдаёт release-please
            # (major.minor.patch), и так же названы теги образов. Пока здесь
            # разбиралось имя тега git, деплой просил runit-app:v1.2.3 и падал
            # на docker compose pull с «manifest unknown».
            export RUNIT_VERSION="${{ inputs.version }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --wait
            docker image prune -f

      - name: Стенд отвечает снаружи
        if: steps.check.outputs.configured == 'true'
        run: |
          # Отдельная проверка: healthcheck внутри compose говорит о контейнере,
          # а этот шаг — что сайт доступен снаружи, через прокси и TLS.
          for i in $(seq 1 10); do
            if curl -sf "https://${{ vars.DEPLOY_HOST }}/health"; then
              echo "стенд отвечает"
              exit 0
            fi
            sleep 5
          done
          echo "стенд не ответил на /health после раскатки"
          exit 1

  deploy-heroku:
    name: Раскатка на PaaS (Heroku)
    # Независимо от deploy: у стендов нет общих ресурсов, и упавший ssh-деплой
    # не повод не выпускать PaaS.
    runs-on: ubuntu-latest
    if: github.repository == 'hexlet-volunteers/runit'
    steps:
      - name: Настроен ли PaaS
        id: check
        env:
          HEROKU_APP: ${{ vars.HEROKU_APP }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_APP" ] || [ -z "$HEROKU_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PaaS не настроен: пусты HEROKU_APP или HEROKU_API_KEY." \
              "Раскатка на Heroku пропущена."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'
        with:
          # Полная история обязательна: Heroku отвергает shallow clone
          # («shallow update not allowed»), а checkout по умолчанию делает
          # именно его — fetch-depth: 1.
          fetch-depth: 0

      - name: Push в Heroku
        if: steps.check.outputs.configured == 'true'
        env:
          HEROKU_APP: ${{ vars.HEROKU_APP }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -e
          # Пушим конкретный коммит, а не ветку: сборку запускает сам Heroku, и
          # получить он должен ровно выпущенное состояние. GITHUB_SHA здесь —
          # коммит мержа релизного PR, то есть тот самый, на который
          # release-please поставил тег.
          #
          # Ветка-приёмник называется main независимо от того, что деплоится:
          # Heroku собирает то, что пришло в его основную ветку. `+` — форс:
          # история приложения на стороне Heroku может расходиться с нашей
          # (откаты через `heroku rollback` не меняют git), и без него push
          # падал бы на non-fast-forward.
          git push --force \
            "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git" \
            "${GITHUB_SHA}:refs/heads/main"

      - name: Стенд отвечает снаружи
        if: steps.check.outputs.configured == 'true'
        env:
          HEROKU_APP: ${{ vars.HEROKU_APP }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          set -e
          # Адрес спрашиваем у API, а не собираем как «<имя>.herokuapp.com»:
          # приложениям, созданным после 2022 года, платформа добавляет в имя
          # хоста случайный суффикс, и собранный вручную адрес не существует —
          # проверка падала бы на исправном стенде. Для своего домена web_url
          # тоже вернёт верное значение.
          BASE=$(curl -sf \
            -H "Authorization: Bearer ${HEROKU_API_KEY}" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            "https://api.heroku.com/apps/${HEROKU_APP}" | jq -r '.web_url')
          URL="${BASE%/}/health"
          echo "проверяем $URL"

          # Своего healthcheck у PaaS нет: маршрутизатор считает приложение
          # живым, как только процесс занял порт. А занять его приложение может
          # и с недоехавшими миграциями — их оно прогоняет при старте. Поэтому
          # проверяем /health, он же проверяет базу.
          #
          # Ожидание длиннее, чем у docker-стенда: там образ уже собран, здесь
          # Heroku после push собирает слаг (npm ci + tsc + сборка Vite).
          for i in $(seq 1 40); do
            if curl -sf "$URL"; then
              echo "стенд отвечает"
              exit 0
            fi
            sleep 15
          done
          echo "стенд не ответил на $URL после раскатки"
          exit 1
