name: Релиз

# Выпуск версии по тегу vX.Y.Z.
#
# Раньше здесь стояла заглушка с `echo «Deployment is temporarily disabled»`.
# Она была вредна дважды: изображала зелёный деплой, которого не существует,
# и условие `if: github.repository == 'hexlet-rus/runit'` не совпадало с
# текущим репозиторием — то есть job не запускался вообще.
#
# Сейчас на тег происходит два независимых действия:
#   * publish.yml собирает и публикует образы бэкенда и фронтенда в GHCR;
#   * этот workflow создаёт запись в GitHub Releases.
#
# Раскатки на стенд здесь пока нет намеренно: она появится вместе с
# docker-compose.prod.yml после переезда на PostgreSQL (#895) — раскатывать
# сборку на SQLite на боевой стенд смысла нет.

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  release:
    name: Запись в GitHub Releases
    runs-on: ubuntu-latest
    if: github.repository == 'hexlet-volunteers/runit'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история нужна для автоматических примечаний к релизу.
          fetch-depth: 0

      - name: Создать релиз
        # --verify-tag: без него команда создала бы релиз на несуществующий тег
        # при ручном запуске из ветки.
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
