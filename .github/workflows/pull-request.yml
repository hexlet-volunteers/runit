name: On Pull Request

# Без фильтра по базовой ветке намеренно. С `branches: [main]` проверки не
# запускались у PR, нацеленных на другую ветку, — то есть у любого PR из
# цепочки (когда крупная работа разбита на несколько PR, где второй стоит на
# первом). Такой PR выглядел как «проверок нет», и это легко принять за
# «проверять нечего».
on:
  pull_request:

jobs:
  backend:
    name: Бэкенд — линтер, типы, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Линтер (Biome)
        run: npm run lint

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Юнит-тесты раннера
        # Docker в CI не нужен: тесты проверяют сборку аргументов docker и ветки
        # деградации через внедрение зависимостей.
        run: npm run test:runner

      - name: Тесты авторизации и политики паролей
        # Права доступа к процедурам обязаны проверяться на каждом PR: забыть
        # middleware в новой процедуре легко, и снаружи это не видно, пока
        # чужой сниппет не окажется доступен по перебору id.
        # Секреты не задаются намеренно — в NODE_ENV=test подставляются
        # дев-значения, а обязательность JWT_* проверяется только в production.
        run: npm run test:unit

      - name: Уязвимости прод-зависимостей
        # Только прод-дерево (--omit=dev) и только high и выше. Причина: сборочные
        # и линтерские пакеты на прод не попадают, и падение сборки из-за
        # уязвимости в devDependency приучает пропускать красный CI — после чего
        # незамеченной проезжает уже настоящая. Порог осмысленный: сейчас
        # прод-дерево бэкенда чистое, поэтому шаг реально сторожит, а не украшает.
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Фронтенд — сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci
        working-directory: frontend

      - name: Установка зависимостей бэкенда
        # Фронт импортирует тип роутера из types/, а тот ссылается на
        # @trpc/server — пакет из корневого дерева. Без него tsc не разрешает
        # ссылку и молча выводит тип роутера как unknown: проверка типов
        # проходила, но проверяла пустышку. Ловится это только на коде, который
        # опирается на вывод типа процедуры, — так и обнаружилось.
        run: npm ci

      - name: Проверка типов
        # Стало возможным после удаления легаси: раньше tsc падал на v2-legacy,
        # и фронтенд ехал в CI вообще без проверки типов — vite build их не
        # смотрит. Именно так проехали четыре ошибки после сужения типа языка.
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Сборка
        run: npm run build
        working-directory: frontend

      - name: Уязвимости прод-зависимостей
        # Тот же порог, что у бэкенда. После чистки легаси и перехода на один
        # пакет роутера дерево фронта чистое, поэтому шаг сторожит с первого дня.
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Образ бэкенда
        run: docker build -t runit-app:ci .

      - name: Образ фронтенда
        # Контекст — корень репозитория: фронту нужны типы из types/.
        run: docker build -f frontend/Dockerfile -t runit-web:ci .

  runner-smoke:
    name: Раннер — исполнение 9 языков в Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка образов языков
        # На раннере GitHub Actions Docker есть, поэтому happy path раннера
        # проверяется здесь — у разработчика демон может быть выключен.
        run: npm run runner:build-images

      - name: Запуск сервера
        run: |
          # Миграции не в git (каталог drizzle/ в .gitignore), поэтому их нужно
          # сгенерировать из схемы — иначе сервер падает на старте.
          npm run db:generate
          # Лимит запусков кода поднят только для смоука: боевые 12/мин рассчитаны
          # на человека, а здесь один прогон делает больше десятка запусков подряд
          # с одного адреса. Проверяем раннер, а не лимитер — его отдельно
          # покрывают тесты src/security.ts.
          DB_PATH=/tmp/ci.sqlite RATE_LIMIT_RUNNER=200 npx tsx src/server.ts &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3001/health

      - name: Прогон языков, stdin, таймаута и изоляции сети
        run: npm run runner:smoke

      - name: Контейнеры не осиротели после таймаута
        run: |
          left=$(docker ps -aq --filter label=runit-runner | wc -l)
          echo "оставшихся контейнеров раннера: $left"
          test "$left" -eq 0
