name: On Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Бэкенд — линтер, типы, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Линтер (Biome)
        run: npm run lint

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Юнит-тесты раннера
        # Docker в CI не нужен: тесты проверяют сборку аргументов docker и ветки
        # деградации через внедрение зависимостей.
        run: npm run test:runner

  frontend:
    name: Фронтенд — сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci
        working-directory: frontend

      - name: Сборка
        run: npm run build
        working-directory: frontend

  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Образ бэкенда
        run: docker build -t runit-app:ci .

      - name: Образ фронтенда
        # Контекст — корень репозитория: фронту нужны типы из types/.
        run: docker build -f frontend/Dockerfile -t runit-web:ci .
